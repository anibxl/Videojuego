<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04070f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Hoop Bounce — Mondes</title>
  <link rel="preload" href="assets/fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/worlds.css">
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <header class="top">
    <a class="icon-btn" id="btn-back" href="index.html" data-label="map.back">
      <svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
    </a>
    <h1 class="title" data-t="map.title"></h1>
    <div class="total">
      <span class="total-stars"><span class="mini-star"></span><b id="total-stars">0</b><i id="total-max">/ 0</i></span>
      <div class="total-progress" aria-hidden="true"><div class="bar"><i id="total-bar"></i></div></div>
      <span class="total-pct" id="total-pct">0 %</span>
    </div>
  </header>

  <main class="track" id="track" aria-label="Mondes"></main>

  <nav class="dots" id="dots" aria-hidden="true"></nav>

  <!-- Choix du niveau -->
  <div class="sheet hidden" id="sheet" role="dialog" aria-labelledby="sheet-name">
    <div class="sheet-panel">
      <div class="sheet-head">
        <div>
          <p class="sheet-eyebrow" id="sheet-world"></p>
          <h2 id="sheet-name"></h2>
        </div>
        <div class="sheet-stats">
          <span class="total-stars"><span class="mini-star"></span><b id="sheet-stars"></b></span>
          <span class="sheet-pct" id="sheet-pct"></span>
        </div>
        <button class="icon-btn" id="sheet-close" data-label="map.back">
          <svg viewBox="0 0 24 24"><path d="M18.3 7.1 16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg>
        </button>
      </div>
      <p class="sheet-hint" data-t="map.chooseLevel"></p>
      <div class="levels" id="levels"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="wipe" id="wipe" aria-hidden="true"><div class="wipe-band"></div></div>
  <div class="rotate">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 2h-9A1.5 1.5 0 0 0 6 3.5v17A1.5 1.5 0 0 0 7.5 22h9a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 16.5 2zM12 20.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM16 17H8V4h8z"/></svg>
    <p data-t-html="rotate"></p>
  </div>
  <div class="fade" id="fade" aria-hidden="true"></div>

  <script type="module" src="src/worlds/main.js"></script>
</body>
</html>
