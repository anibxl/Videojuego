<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>HoopBounce — Feature Graphic (1024 × 500)</title>
<!-- Bannière officielle Google Play. Rendue en PNG par store/tools/render-assets.mjs (?lang=fr|en|es). -->
<style>
  @font-face { font-family: "Unbounded"; src: url("../../assets/fonts/unbounded.woff2") format("woff2"); font-weight: 200 900; }
  @font-face { font-family: "Outfit"; src: url("../../assets/fonts/outfit.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #000; }
  .fg {
    position: relative;
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 40% 60% at 72% 46%, rgba(255, 122, 47, 0.22), transparent 70%),
      radial-gradient(ellipse 50% 80% at 0% 100%, rgba(60, 100, 230, 0.22), transparent 70%),
      radial-gradient(ellipse 60% 70% at 100% 0%, rgba(120, 80, 240, 0.16), transparent 70%),
      linear-gradient(180deg, #0a1230 0%, #060a18 55%, #03050b 100%);
    font-family: "Outfit", sans-serif;
    color: #f2f5ff;
  }
  svg.scene { position: absolute; inset: 0; }
  .text { position: absolute; left: 76px; top: 158px; }
  .logo {
    margin: 0;
    font-family: "Unbounded", sans-serif;
    font-weight: 800;
    font-size: 68px;
    line-height: 1;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .logo .a { color: #f4f7ff; text-shadow: 0 2px 30px rgba(120, 160, 255, 0.3); }
  .logo .b {
    background: linear-gradient(180deg, #ffb067 0%, #ff7a2f 55%, #f05312 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 6px 22px rgba(255, 106, 33, 0.45));
  }
  .tag {
    margin: 22px 0 0 4px;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #c3cdea;
  }
  .tag b { color: #ff9b52; font-weight: 700; }
  .by { margin: 14px 0 0 5px; font-size: 14px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #6f7c9d; }
</style>
</head>
<body>
<div class="fg" id="fg">
  <svg class="scene" viewBox="0 0 1024 500" aria-hidden="true">
    <defs>
      <radialGradient id="ballg" cx="36%" cy="30%" r="75%">
        <stop offset="0" stop-color="#ffb26b"/><stop offset=".45" stop-color="#ff7a2f"/><stop offset="1" stop-color="#c8430f"/>
      </radialGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#cfdcff" stop-opacity=".22"/><stop offset="1" stop-color="#cfdcff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a2244" stop-opacity=".0"/><stop offset=".25" stop-color="#16203f" stop-opacity=".9"/><stop offset="1" stop-color="#090d1c"/>
      </linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/><stop offset=".5" stop-color="#9fb6ff" stop-opacity=".07"/><stop offset="1" stop-color="#ffffff" stop-opacity=".14"/>
      </linearGradient>
      <radialGradient id="spot" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff4dc" stop-opacity=".95"/><stop offset=".25" stop-color="#ffd9a0" stop-opacity=".45"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="ballglow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ff8a3d" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ff7a2f" stop-opacity="0"/><stop offset="1" stop-color="#ffb067" stop-opacity=".75"/>
      </linearGradient>
      <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    </defs>

    <!-- Projecteurs de la salle -->
    <g opacity=".9">
      <polygon points="600,0 660,0 820,500 420,500" fill="url(#beam)"/>
      <polygon points="880,0 930,0 1024,330 1024,500 760,500" fill="url(#beam)" opacity=".7"/>
      <polygon points="330,0 370,0 470,500 140,500" fill="url(#beam)" opacity=".45"/>
    </g>
    <g>
      <circle cx="630" cy="10" r="46" fill="url(#spot)"/>
      <circle cx="905" cy="8" r="36" fill="url(#spot)"/>
      <circle cx="350" cy="6" r="28" fill="url(#spot)" opacity=".7"/>
    </g>
    <!-- Tribunes floues (lumières) -->
    <g fill="#9fb6ff" opacity=".35" filter="url(#blur2)">
      <circle cx="120" cy="250" r="3"/><circle cx="170" cy="236" r="2.5"/><circle cx="230" cy="244" r="3"/><circle cx="420" cy="232" r="2.5"/>
      <circle cx="520" cy="246" r="3"/><circle cx="560" cy="228" r="2"/><circle cx="980" cy="240" r="3"/><circle cx="1004" cy="214" r="2"/>
    </g>
    <g fill="#ffb067" opacity=".35" filter="url(#blur2)">
      <circle cx="300" cy="240" r="2.5"/><circle cx="470" cy="252" r="2"/><circle cx="960" cy="262" r="2.5"/>
    </g>

    <!-- Parquet en perspective -->
    <rect x="0" y="330" width="1024" height="170" fill="url(#floor)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="2">
      <path d="M-40 500 L380 340"/><path d="M200 500 L470 340"/><path d="M500 500 L560 340"/><path d="M800 500 L650 340"/><path d="M1080 500 L740 340"/>
      <ellipse cx="770" cy="430" rx="250" ry="46"/>
    </g>
    <path d="M0 340 H1024" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>
    <!-- reflet du ballon et du panier sur le parquet -->
    <ellipse cx="770" cy="428" rx="120" ry="16" fill="#ff7a2f" opacity=".16" filter="url(#blur6)"/>

    <!-- Panier : poteau, panneau de verre, cercle, filet -->
    <g>
      <rect x="912" y="140" width="16" height="290" rx="4" fill="#26324f"/>
      <rect x="900" y="425" width="40" height="10" rx="3" fill="#1b2440"/>
      <path d="M920 150 H872" stroke="#2c3858" stroke-width="12" stroke-linecap="round"/>
      <rect x="770" y="70" width="112" height="150" rx="8" fill="url(#glass)" stroke="#e8eeff" stroke-opacity=".85" stroke-width="4"/>
      <rect x="802" y="130" width="50" height="40" rx="3" fill="none" stroke="#ff7a2f" stroke-width="5"/>
      <!-- arrière du cercle -->
      <ellipse cx="786" cy="196" rx="52" ry="11" fill="none" stroke="#a8361a" stroke-width="7"/>
      <!-- filet -->
      <g fill="none" stroke="#f2f5ff" stroke-opacity=".85" stroke-width="2.6" stroke-linecap="round">
        <path d="M736 198 L752 262"/><path d="M752 205 L762 266"/><path d="M770 207 L774 268"/><path d="M786 208 L786 268"/>
        <path d="M802 207 L798 268"/><path d="M820 205 L810 266"/><path d="M836 198 L820 262"/>
        <path d="M742 222 Q786 238 830 222"/><path d="M748 244 Q786 256 824 244"/><path d="M752 262 Q786 274 820 262"/>
      </g>
    </g>

    <!-- Trajectoire du ballon : traînée lumineuse et fantômes -->
    <path d="M572 392 Q630 150 712 132" fill="none" stroke="url(#trail)" stroke-width="14" stroke-linecap="round" opacity=".55" filter="url(#blur2)"/>
    <path d="M572 392 Q630 150 712 132" fill="none" stroke="#fff3e0" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round" opacity=".6"/>
    <g opacity=".2"><circle cx="612" cy="262" r="26" fill="#ff7a2f"/></g>
    <g opacity=".32"><circle cx="652" cy="182" r="31" fill="#ff7a2f"/></g>
    <!-- impact au sol (rebond) -->
    <g stroke="#ffd2a6" stroke-linecap="round" stroke-width="3" opacity=".7">
      <path d="M550 404 L534 412"/><path d="M572 410 L572 424"/><path d="M594 404 L610 412"/>
    </g>
    <ellipse cx="572" cy="404" rx="40" ry="7" fill="none" stroke="#ffb067" stroke-opacity=".5" stroke-width="2"/>

    <!-- Ballon -->
    <circle cx="716" cy="128" r="84" fill="url(#ballglow)"/>
    <g transform="translate(716 128) rotate(-18)">
      <circle r="46" fill="url(#ballg)"/>
      <g fill="none" stroke="#2a1206" stroke-width="4.6" stroke-linecap="round" opacity=".88">
        <path d="M0 -46V46M-46 0H46"/>
        <path d="M-32 -33c14 10 19 22 19 33s-5 23-19 33"/>
        <path d="M32 -33c-14 10 -19 22 -19 33s5 23 19 33"/>
      </g>
      <ellipse cx="-15" cy="-22" rx="15" ry="8" fill="#fff" opacity=".22" transform="rotate(-25 -15 -22)"/>
    </g>
    <!-- avant du cercle (devant le filet) -->
    <path d="M734 196 A52 11 0 0 0 838 196" fill="none" stroke="#ff5a1f" stroke-width="7" stroke-linecap="round"/>

    <!-- Étincelles -->
    <g fill="#ffe2b8">
      <circle cx="770" cy="56" r="2.4"/><circle cx="672" cy="84" r="1.8"/><circle cx="700" cy="196" r="1.6"/><circle cx="650" cy="120" r="1.4"/>
      <circle cx="420" cy="90" r="1.6" opacity=".6"/><circle cx="270" cy="70" r="1.4" opacity=".5"/><circle cx="560" cy="60" r="1.6" opacity=".6"/>
    </g>
    <g fill="#bcd0ff" opacity=".6">
      <circle cx="160" cy="80" r="1.6"/><circle cx="60" cy="130" r="1.2"/><circle cx="980" cy="120" r="1.4"/><circle cx="880" cy="300" r="1.4"/>
    </g>
  </svg>

  <div class="text">
    <h1 class="logo"><span class="a">Hoop</span><span class="b">Bounce</span></h1>
    <p class="tag" id="tag">Dribble · Rebondis · <b>Marque</b></p>
    <p class="by" id="by">Par EchoSpeed</p>
  </div>
</div>
<script>
  const lang = new URLSearchParams(location.search).get('lang') || 'fr';
  const T = {
    fr: ['Dribble · Rebondis · <b>Marque</b>', 'Par EchoSpeed'],
    en: ['Dribble · Bounce · <b>Score</b>', 'By EchoSpeed'],
    es: ['Bota · Rebota · <b>Encesta</b>', 'Por EchoSpeed'],
  }[lang] || [];
  if (T.length) {
    document.getElementById('tag').innerHTML = T[0];
    document.getElementById('by').textContent = T[1];
    document.documentElement.lang = lang;
  }
</script>
</body>
</html>
