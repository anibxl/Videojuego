<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1222">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <title>Hoop Bounce</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Arrivée depuis le menu : fondu depuis le noir */
    body::after { content: ""; position: fixed; inset: 0; background: #04070f; pointer-events: none; animation: from-black .6s ease .05s forwards; }
    @keyframes from-black { to { opacity: 0; visibility: hidden; } }
    a.btn { text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Zone de jeu"></canvas>

  <div class="hud">
    <div class="stars" id="stars" aria-label="Étoiles ramassées">
      <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
      <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
      <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
    </div>
    <div class="title">
      <span class="level-name" id="level-name">Niveau 1</span>
      <span class="timer" id="timer">0:00</span>
    </div>
    <div class="buttons">
      <a class="btn" id="btn-home" href="index.html" title="Menu principal (Échap)" aria-label="Menu principal">
        <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4.5l8 6.7V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>
      </a>
      <button class="btn" id="btn-restart" title="Recommencer le niveau (R)" aria-label="Recommencer le niveau">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <button class="btn" id="btn-sound" title="Son (M)" aria-label="Couper ou activer le son">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm15.6 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/></svg>
      </button>
    </div>
  </div>

  <div class="controls" aria-hidden="true">
    <div class="dpad">
      <div class="pad" id="pad-left"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></div>
      <div class="pad" id="pad-right"><svg viewBox="0 0 24 24"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg></div>
    </div>
    <div class="bounce" id="pad-bounce">
      <svg class="ring" viewBox="0 0 100 100" id="power-ring"></svg>
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 4 5 11l1.4 1.4L11 7.8V20h2V7.8l4.6 4.6L19 11z"/></svg>
    </div>
  </div>

  <div class="overlay hidden" id="results" role="dialog" aria-labelledby="results-title">
    <div class="card">
      <p class="eyebrow" id="res-level">Niveau 1</p>
      <h1 id="results-title">Panier !</h1>
      <div class="result-stars" id="result-stars">
        <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
        <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
        <svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
      </div>
      <dl class="stats">
        <div><dt>Temps</dt><dd id="res-time">0:00.0</dd></div>
        <div><dt>Chutes</dt><dd id="res-deaths">0</dd></div>
        <div><dt>Record</dt><dd id="res-best">—</dd></div>
      </dl>
      <p class="badge hidden" id="res-record">Nouveau record !</p>
      <button class="primary" id="btn-replay">Rejouer</button>
    </div>
  </div>

  <div class="rotate" id="rotate">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 2h-9A1.5 1.5 0 0 0 6 3.5v17A1.5 1.5 0 0 0 7.5 22h9a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 16.5 2zM12 20.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM16 17H8V4h8z"/></svg>
    <p>Tourne ton téléphone<br>à l’horizontale</p>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
