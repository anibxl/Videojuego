<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04070f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Hoop Bounce</title>
  <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/type.css">
  <link rel="stylesheet" href="css/ghost.css">
</head>
<body>
  <canvas id="game" aria-label="Zone de jeu"></canvas>

  <!-- HUD discret -->
  <div class="hud">
    <div class="hud-left">
      <div class="level-chip">
        <span class="level-num" id="level-num"></span>
        <span class="level-name" id="level-name"></span>
      </div>
      <div class="stars" id="stars" aria-label="Étoiles">
        <span class="star" data-star="0"></span><span class="star" data-star="1"></span><span class="star" data-star="2"></span>
      </div>
    </div>
    <div class="hud-right">
      <button class="btn" id="btn-restart" data-label="hud.restart">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <button class="btn" id="btn-pause" data-label="hud.pause">
        <svg viewBox="0 0 24 24"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>
      </button>
    </div>
  </div>

  <!-- Mode Fantôme (phase 3) : carte de départ, s'efface dès qu'on s'élance -->
  <div class="start-card" id="start-card" hidden aria-live="polite">
    <p class="sc-level" id="sc-level"></p>
    <p class="sc-row"><svg class="sc-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3v2.5a4.5 4.5 0 0 1-4.1 4.48A5 5 0 0 1 13 14.9V17h3v3H8v-3h3v-2.1a5 5 0 0 1-2.9-2.92A4.5 4.5 0 0 1 4 7.5V5h3zm0 4H6v.5a2.5 2.5 0 0 0 1.4 2.25A5 5 0 0 1 7 8zm10 0v1a5 5 0 0 1-.4 1.75A2.5 2.5 0 0 0 18 7.5V7z"/></svg><span data-t="ghost.best"></span><strong id="sc-best"></strong></p>
    <p class="sc-row sc-ghost-row"><svg class="gh-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8a7.4 7.4 0 0 0-7.4 7.4v9.9a1.1 1.1 0 0 0 1.9.8l1.5-1.5 1.6 1.6a1.1 1.1 0 0 0 1.6 0L12 19.4l1.6 1.6a1.1 1.1 0 0 0 1.6 0l1.6-1.6 1.5 1.5a1.1 1.1 0 0 0 1.9-.8v-9.9A7.4 7.4 0 0 0 12 2.8z"/><circle cx="9.3" cy="10.4" r="1.35" fill="var(--gh-eye, #0b1630)"/><circle cx="14.7" cy="10.4" r="1.35" fill="var(--gh-eye, #0b1630)"/></svg><span id="sc-ghost"></span></p>
    <button class="ghost-toggle" type="button" data-ghost-toggle aria-pressed="true"><svg class="gh-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8a7.4 7.4 0 0 0-7.4 7.4v9.9a1.1 1.1 0 0 0 1.9.8l1.5-1.5 1.6 1.6a1.1 1.1 0 0 0 1.6 0L12 19.4l1.6 1.6a1.1 1.1 0 0 0 1.6 0l1.6-1.6 1.5 1.5a1.1 1.1 0 0 0 1.9-.8v-9.9A7.4 7.4 0 0 0 12 2.8z"/><circle cx="9.3" cy="10.4" r="1.35" fill="var(--gh-eye, #0b1630)"/><circle cx="14.7" cy="10.4" r="1.35" fill="var(--gh-eye, #0b1630)"/></svg><span data-t="ghost.label"></span><em class="gt-state"></em></button>
  </div>

  <!-- Commandes tactiles (dessin ; les touchers sont gérés sur tout l'écran) -->
  <div class="controls" aria-hidden="true">
    <div class="dpad">
      <div class="pad" id="pad-left"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></div>
      <div class="pad" id="pad-right"><svg viewBox="0 0 24 24"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg></div>
      <div class="tuto-label tuto-move" id="tuto-move"><span data-t="tuto.move"></span></div>
    </div>
    <div class="bounce" id="pad-bounce">
      <svg class="ring" viewBox="0 0 100 100" id="power-ring"></svg>
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 4 5 11l1.4 1.4L11 7.8V20h2V7.8l4.6 4.6L19 11z"/></svg>
      <div class="tuto-label tuto-bounce" id="tuto-bounce"><span data-t="tuto.bounce"></span><small data-t="tuto.bounce.sub"></small></div>
    </div>
  </div>

  <!-- Pause -->
  <div class="overlay hidden" id="pause" role="dialog" aria-labelledby="pause-title">
    <div class="card">
      <h1 id="pause-title" data-t="pause.title"></h1>
      <div class="actions">
        <button class="primary" id="btn-resume"><svg viewBox="0 0 24 24"><path d="M8.5 5.8v12.4a1 1 0 0 0 1.5.86l10.1-6.2a1 1 0 0 0 0-1.72L10 4.94a1 1 0 0 0-1.5.86z"/></svg><span data-t="pause.resume"></span></button>
        <button class="secondary" id="btn-pause-restart"><span data-t="pause.restart"></span></button>
        <button class="secondary ghost-toggle ghost-toggle-wide" type="button" data-ghost-toggle aria-pressed="true"><svg class="gh-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8a7.4 7.4 0 0 0-7.4 7.4v9.9a1.1 1.1 0 0 0 1.9.8l1.5-1.5 1.6 1.6a1.1 1.1 0 0 0 1.6 0L12 19.4l1.6 1.6a1.1 1.1 0 0 0 1.6 0l1.6-1.6 1.5 1.5a1.1 1.1 0 0 0 1.9-.8v-9.9A7.4 7.4 0 0 0 12 2.8z"/><circle cx="9.3" cy="10.4" r="1.35" fill="var(--gh-eye, #0b1630)"/><circle cx="14.7" cy="10.4" r="1.35" fill="var(--gh-eye, #0b1630)"/></svg><span data-t="ghost.label"></span><em class="gt-state"></em></button>
        <a class="secondary" id="btn-pause-map" href="index.html#mondes"><span data-t="pause.map"></span></a>
        <a class="secondary" id="btn-pause-menu" href="index.html"><span data-t="pause.menu"></span></a>
      </div>
    </div>
  </div>

  <!-- Victoire -->
  <div class="overlay hidden" id="win" role="dialog" aria-labelledby="win-title">
    <div class="card win-card">
      <p class="eyebrow" id="win-level"></p>
      <h1 id="win-title"></h1>
      <div class="win-stars" id="win-stars">
        <span class="star big" data-star="0"></span><span class="star big mid" data-star="1"></span><span class="star big" data-star="2"></span>
      </div>
      <p class="win-body" id="win-body" hidden></p>
      <p class="win-time"><span data-t="win.time"></span> <strong id="win-time"></strong> <em id="win-record" hidden></em></p>
      <p class="win-ghost" id="win-ghost" hidden><span class="wg-spark" aria-hidden="true"></span><b></b><small></small></p>
      <div class="win-reward" id="win-reward" hidden>
        <p class="win-coins" id="win-coins"><span class="reward-label" data-t="win.reward"></span><span class="coin-ico" aria-hidden="true"></span><b id="win-coins-n">+0</b><span class="x2" id="win-x2" aria-hidden="true">×2</span></p>
        <!-- Publicité récompensée (optionnelle) : doubler les pièces -->
        <button class="ad-btn" id="btn-double" type="button">
          <span class="ad-ico ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11.5" rx="1.8"/><path d="M2.8 6.6h18.4V9H2.8zM12 6.6v13.9"/><path d="M12 6.6c-1.2-2.8-4.6-3.6-5.3-1.7-.5 1.4 1.6 1.7 5.3 1.7zM12 6.6c1.2-2.8 4.6-3.6 5.3-1.7.5 1.4-1.6 1.7-5.3 1.7z"/></svg></span>
          <span class="ad-txt"><b data-t="ad.watch"></b><small id="btn-double-sub" data-t="ad.double"></small></span>
        </button>
      </div>
      <div class="actions">
        <button class="primary" id="btn-next"><span data-t="win.next"></span><svg viewBox="0 0 24 24"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg></button>
        <div class="actions-row three">
          <button class="secondary" id="btn-replay"><span data-t="win.replay"></span></button>
          <a class="secondary" id="btn-win-map" href="index.html#mondes"><span data-t="win.map"></span></a>
          <a class="secondary" id="btn-win-menu" href="index.html"><span data-t="win.menu"></span></a>
        </div>
      </div>
    </div>
  </div>

  <!-- Niveau échoué (après une chute, quand un drapeau a été atteint) -->
  <div class="overlay hidden" id="fail" role="dialog" aria-labelledby="fail-title">
    <div class="card fail-card">
      <p class="eyebrow" id="fail-level"></p>
      <h1 id="fail-title" data-t="fail.title"></h1>
      <p class="fail-body" id="fail-body"></p>
      <div class="actions">
        <button class="primary" id="btn-fail-restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><span data-t="fail.restart"></span></button>
        <!-- Publicité récompensée (optionnelle) : reprendre au dernier drapeau -->
        <button class="ad-btn" id="btn-fail-continue" type="button">
          <span class="ad-ico ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11.5" rx="1.8"/><path d="M2.8 6.6h18.4V9H2.8zM12 6.6v13.9"/><path d="M12 6.6c-1.2-2.8-4.6-3.6-5.3-1.7-.5 1.4 1.6 1.7 5.3 1.7zM12 6.6c1.2-2.8 4.6-3.6 5.3-1.7.5 1.4-1.6 1.7-5.3 1.7z"/></svg></span>
          <span class="ad-txt"><b id="btn-fail-continue-label" data-t="ad.watch"></b><small id="btn-fail-continue-sub" data-t="ad.checkpoint"></small></span>
        </button>
        <div class="actions-row">
          <a class="secondary" id="btn-fail-map" href="index.html#mondes"><span data-t="win.map"></span></a>
          <a class="secondary" id="btn-fail-menu" href="index.html"><span data-t="win.menu"></span></a>
        </div>
      </div>
    </div>
  </div>

  <!-- Mission terminée / succès débloqué (annoncé pendant la partie) -->
  <div class="live-banner" id="live-banner" role="status" aria-live="polite">
    <span class="live-ico" aria-hidden="true"></span>
    <span class="live-txt"><b id="live-title"></b><span id="live-text"></span></span>
  </div>

  <!-- Introduction d'un monde -->
  <div class="intro hidden" id="intro" role="dialog" aria-labelledby="intro-name">
    <div class="intro-inner">
      <p class="intro-eyebrow" id="intro-world"></p>
      <h1 class="intro-title" id="intro-name"></h1>
      <p class="intro-tagline" id="intro-tagline"></p>
      <ul class="intro-mechs" id="intro-mechs"></ul>
      <p class="intro-level" id="intro-level"></p>
      <p class="intro-tap" data-t="intro.tap"></p>
    </div>
  </div>

  <!-- Confettis de victoire (étape 18) -->
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <!-- Transition entre deux mondes -->
  <div class="wipe" id="wipe" aria-hidden="true"><div class="wipe-band"></div></div>

  <div class="rotate" id="rotate">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 2h-9A1.5 1.5 0 0 0 6 3.5v17A1.5 1.5 0 0 0 7.5 22h9a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 16.5 2zM12 20.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM16 17H8V4h8z"/></svg>
    <p data-t-html="rotate"></p>
  </div>

  <div class="fade" id="fade" aria-hidden="true"></div>

  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/shared/ui-polish.js"></script>
</body>
</html>
