<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04070f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Hoop Bounce</title>
  <link rel="preload" href="assets/fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Zone de jeu"></canvas>

  <!-- HUD discret -->
  <div class="hud">
    <div class="hud-left">
      <div class="level-chip">
        <span class="level-num" id="level-num"></span>
        <span class="level-name" id="level-name"></span>
      </div>
      <div class="stars" id="stars" aria-label="Étoiles">
        <span class="star" data-star="0"></span><span class="star" data-star="1"></span><span class="star" data-star="2"></span>
      </div>
    </div>
    <div class="hud-right">
      <button class="btn" id="btn-restart" data-label="hud.restart">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <button class="btn" id="btn-pause" data-label="hud.pause">
        <svg viewBox="0 0 24 24"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>
      </button>
    </div>
  </div>

  <!-- Commandes tactiles (dessin ; les touchers sont gérés sur tout l'écran) -->
  <div class="controls" aria-hidden="true">
    <div class="dpad">
      <div class="pad" id="pad-left"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></div>
      <div class="pad" id="pad-right"><svg viewBox="0 0 24 24"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg></div>
      <div class="tuto-label tuto-move" id="tuto-move"><span data-t="tuto.move"></span></div>
    </div>
    <div class="bounce" id="pad-bounce">
      <svg class="ring" viewBox="0 0 100 100" id="power-ring"></svg>
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 4 5 11l1.4 1.4L11 7.8V20h2V7.8l4.6 4.6L19 11z"/></svg>
      <div class="tuto-label tuto-bounce" id="tuto-bounce"><span data-t="tuto.bounce"></span><small data-t="tuto.bounce.sub"></small></div>
    </div>
  </div>

  <!-- Pause -->
  <div class="overlay hidden" id="pause" role="dialog" aria-labelledby="pause-title">
    <div class="card">
      <h1 id="pause-title" data-t="pause.title"></h1>
      <div class="actions">
        <button class="primary" id="btn-resume"><svg viewBox="0 0 24 24"><path d="M8.5 5.8v12.4a1 1 0 0 0 1.5.86l10.1-6.2a1 1 0 0 0 0-1.72L10 4.94a1 1 0 0 0-1.5.86z"/></svg><span data-t="pause.resume"></span></button>
        <button class="secondary" id="btn-pause-restart"><span data-t="pause.restart"></span></button>
        <a class="secondary" id="btn-pause-map" href="worlds.html"><span data-t="pause.map"></span></a>
        <a class="secondary" id="btn-pause-menu" href="index.html"><span data-t="pause.menu"></span></a>
      </div>
    </div>
  </div>

  <!-- Victoire -->
  <div class="overlay hidden" id="win" role="dialog" aria-labelledby="win-title">
    <div class="card win-card">
      <p class="eyebrow" id="win-level"></p>
      <h1 id="win-title"></h1>
      <div class="win-stars" id="win-stars">
        <span class="star big" data-star="0"></span><span class="star big mid" data-star="1"></span><span class="star big" data-star="2"></span>
      </div>
      <p class="win-body" id="win-body" hidden></p>
      <p class="win-time"><span data-t="win.time"></span> <strong id="win-time"></strong> <em id="win-record" hidden></em></p>
      <p class="win-coins" id="win-coins" hidden><span class="coin-ico" aria-hidden="true"></span><b id="win-coins-n">+0</b></p>
      <div class="actions">
        <button class="primary" id="btn-next"><span data-t="win.next"></span><svg viewBox="0 0 24 24"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg></button>
        <div class="actions-row three">
          <button class="secondary" id="btn-replay"><span data-t="win.replay"></span></button>
          <a class="secondary" id="btn-win-map" href="worlds.html"><span data-t="win.map"></span></a>
          <a class="secondary" id="btn-win-menu" href="index.html"><span data-t="win.menu"></span></a>
        </div>
      </div>
    </div>
  </div>

  <!-- Introduction d'un monde -->
  <div class="intro hidden" id="intro" role="dialog" aria-labelledby="intro-name">
    <div class="intro-inner">
      <p class="intro-eyebrow" id="intro-world"></p>
      <h1 class="intro-title" id="intro-name"></h1>
      <p class="intro-tagline" id="intro-tagline"></p>
      <ul class="intro-mechs" id="intro-mechs"></ul>
      <p class="intro-level" id="intro-level"></p>
      <p class="intro-tap" data-t="intro.tap"></p>
    </div>
  </div>

  <!-- Transition entre deux mondes -->
  <div class="wipe" id="wipe" aria-hidden="true"><div class="wipe-band"></div></div>

  <div class="rotate" id="rotate">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 2h-9A1.5 1.5 0 0 0 6 3.5v17A1.5 1.5 0 0 0 7.5 22h9a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 16.5 2zM12 20.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM16 17H8V4h8z"/></svg>
    <p data-t-html="rotate"></p>
  </div>

  <div class="fade" id="fade" aria-hidden="true"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
