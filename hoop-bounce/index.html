<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04070f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Hoop Bounce</title>
  <link rel="preload" href="assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/boot.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/menu-views.css">
  <link rel="stylesheet" href="css/live.css">
  <link rel="stylesheet" href="css/trickshot-menu.css">
  <link rel="stylesheet" href="css/season-christmas.css">
  <link rel="stylesheet" href="css/pass.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/type.css">
</head>
<body>
  <!-- Écran de chargement (au lancement seulement) : css/boot.css, src/boot/boot.js -->
  <div class="boot" id="boot" role="status" aria-label="HoopBounce">
    <span class="boot-beam" aria-hidden="true"></span>
    <span class="boot-glow" aria-hidden="true"></span>
    <canvas class="boot-particles" aria-hidden="true"></canvas>
    <div class="boot-center">
      <div class="boot-stage" aria-hidden="true">
        <span class="boot-shadow"></span>
        <div class="boot-hop"><div class="boot-squash"><span class="boot-ball"><svg viewBox="0 0 100 100">
          <defs><radialGradient id="boot-ball-g" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="#ffb26b"/><stop offset=".45" stop-color="#ff7a2f"/><stop offset="1" stop-color="#c8430f"/></radialGradient></defs>
          <circle cx="50" cy="50" r="46" fill="url(#boot-ball-g)"/>
          <g fill="none" stroke="#2a1206" stroke-width="3.4" stroke-linecap="round" opacity=".85"><path d="M50 4v92M4 50h92"/><path d="M17 17c11 9 15 20 15 33s-4 24-15 33"/><path d="M83 17c-11 9-15 20-15 33s4 24 15 33"/></g>
          <ellipse cx="34" cy="27" rx="15" ry="9" fill="#fff" opacity=".18" transform="rotate(-25 34 27)"/>
        </svg></span></div></div>
      </div>
      <h1 class="boot-logo"><span class="b1">Hoop</span><span class="b2">Bounce</span></h1>
      <p class="boot-by"><span data-by>Par</span> <b>EchoSpeed</b></p>
    </div>
    <span class="boot-bar" aria-hidden="true"><i></i></span>
  </div>
  <script src="src/boot/boot.js"></script>

  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="app" id="app" data-page="home">
    <!-- Barre du haut : solde de pièces -->
    <header class="topbar">
      <!-- Revenir chaque jour : récompense quotidienne, missions, succès (étape 12) -->
      <button class="hub pressable" data-nav="quotidien" style="--accent: 255,201,77"><span class="hub-icon" data-icon="gift"></span><span class="hub-label" data-i18n="nav.daily"></span><span class="hub-badge" hidden></span></button>
      <button class="hub pressable" data-nav="missions" style="--accent: 63,224,184"><span class="hub-icon" data-icon="target"></span><span class="hub-label" data-i18n="nav.missions"></span><span class="hub-badge" hidden></span></button>
      <button class="hub pressable" data-nav="succes" style="--accent: 180,107,255"><span class="hub-icon" data-icon="trophy"></span><span class="hub-label" data-i18n="nav.achievements"></span><span class="hub-badge" hidden></span></button>
      <!-- Coffre bonus et roue de la chance, publicités facultatives (étape 13) -->
      <button class="hub pressable" data-nav="bonus" style="--accent: 255,122,47"><span class="hub-icon" data-icon="wheel"></span><span class="hub-label" data-i18n="nav.bonus"></span><span class="hub-badge" hidden></span></button>
      <button class="chip coins pressable" id="coins-chip" data-nav="magasin">
        <span class="chip-icon" data-icon="coin"></span>
        <span class="chip-value" id="coin-count">0</span>
      </button>
    </header>

    <!-- Écran d'accueil -->
    <main class="home" id="home">
      <div class="brand">
        <div class="logo" role="img" aria-label="Hoop Bounce">
          <span class="logo-ball" aria-hidden="true"></span>
          <span class="wordmark" aria-hidden="true"><span class="w1">HOOP</span><span class="w2">BOUNCE</span></span>
        </div>
        <p class="tagline" data-i18n="logo.tagline"></p>
      </div>

      <div class="play-row">
      <button class="play pressable" id="btn-play">
        <span class="play-icon" data-icon="play"></span>
        <span class="play-text">
          <span class="play-label" data-i18n="play"></span>
          <span class="play-sub" data-i18n="play.sub"></span>
        </span>
        <span class="play-clip" aria-hidden="true"><span class="play-shine"></span></span>
      </button>
      <!-- Hoop Pass de la saison en cours (src/menu/pass-view.js) : caché hors saison -->
      <button class="pass-btn pressable" data-nav="pass" hidden>
        <span class="pass-btn-clip" aria-hidden="true"><span class="pass-btn-snow"></span><span class="pass-btn-shine"></span></span>
        <span class="pass-btn-lv"><small data-i18n="pass.lvShort"></small><b>1</b></span>
        <span class="pass-btn-text">
          <span class="pass-btn-title">HOOP PASS</span>
          <span class="pass-btn-sub"></span>
          <span class="pass-btn-bar" aria-hidden="true"><i></i></span>
        </span>
        <span class="pass-btn-badge" hidden></span>
      </button>
      </div>

      <nav class="dock" aria-label="Menu">
        <button class="tile pressable" data-nav="mondes" style="--accent: 96,190,255; --i: 0"><span class="tile-icon" data-icon="worlds"></span><span class="tile-label" data-i18n="nav.worlds"></span></button>
        <button class="tile pressable" data-nav="modes" style="--accent: 167,139,255; --i: 1"><span class="tile-icon" data-icon="modes"></span><span class="tile-label" data-i18n="nav.modes"></span></button>
        <button class="tile pressable" data-nav="magasin" style="--accent: 255,201,77; --i: 2"><span class="tile-icon" data-icon="shop"></span><span class="tile-label" data-i18n="nav.shop"></span></button>
        <button class="tile pressable" data-nav="collection" style="--accent: 255,122,47; --i: 3"><span class="tile-icon" data-icon="collection"></span><span class="tile-label" data-i18n="nav.collection"></span></button>
        <button class="tile pressable" data-nav="parametres" style="--accent: 170,190,230; --i: 4"><span class="tile-icon" data-icon="settings"></span><span class="tile-label" data-i18n="nav.settings"></span></button>
      </nav>
    </main>

    <!-- Pages (remplies par src/menu/pages.js) -->
    <section class="page" id="page-mondes" aria-labelledby="title-mondes"></section>
    <section class="page" id="page-modes" aria-labelledby="title-modes"></section>
    <section class="page" id="page-collection" aria-labelledby="title-collection"></section>
    <section class="page" id="page-parametres" aria-labelledby="title-parametres"></section>
    <!-- À propos (Paramètres › À propos de Hoop Bounce) : src/menu/about-page.js, contenu dans src/shared/about.js -->
    <section class="page" id="page-apropos" aria-labelledby="title-apropos"></section>
    <!-- Mode Trickshot : présentation et sélection des niveaux (src/menu/trickshot-view.js) -->
    <section class="page" id="page-trickshot" aria-labelledby="title-trickshot"></section>
    <section class="page" id="page-trickshot-niveaux" aria-labelledby="title-trickshot-niveaux"></section>
    <section class="page live-page" id="page-quotidien" aria-labelledby="title-quotidien"></section>
    <section class="page live-page" id="page-missions" aria-labelledby="title-missions"></section>
    <section class="page live-page" id="page-succes" aria-labelledby="title-succes"></section>
    <section class="page live-page" id="page-bonus" aria-labelledby="title-bonus"></section>
    <!-- Hoop Pass (passe de saison) : src/menu/pass-view.js, css/pass.css -->
    <section class="page" id="page-pass" aria-labelledby="title-pass"></section>

    <!-- Fenêtre (confidentialité, crédits) -->
    <div class="sheet-backdrop" id="sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button class="icon-btn pressable" id="sheet-close" data-icon="close"></button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- Rideau de transition vers la partie -->
  <div class="curtain" id="curtain" aria-hidden="true"></div>

  <div class="rotate" id="rotate">
    <span class="rotate-icon" aria-hidden="true"></span>
    <p data-i18n-html="rotate"></p>
  </div>

  <script type="module" src="src/menu/main.js"></script>
  <script type="module" src="src/shared/ui-polish.js"></script>
</body>
</html>
