<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1424">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Hoop Bounce</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Zone de jeu"></canvas>

  <div class="hud">
    <div class="score" id="score" aria-live="polite">
      <span class="score-value" id="score-value">0</span>
      <span class="score-label">paniers</span>
      <span class="streak" id="streak"></span>
    </div>
    <div class="buttons">
      <button class="btn" id="btn-reset" title="Replacer le ballon (R)" aria-label="Replacer le ballon">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <button class="btn" id="btn-sound" title="Son" aria-label="Couper ou activer le son">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm15.6 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/></svg>
      </button>
      <button class="btn" id="btn-fullscreen" title="Plein écran" aria-label="Plein écran">
        <svg viewBox="0 0 24 24"><path d="M5 5h5V3H3v7h2zm9-2v2h5v5h2V3zM5 14H3v7h7v-2H5zm14 5h-5v2h7v-7h-2z"/></svg>
      </button>
      <button class="btn" id="btn-debug" title="Infos de débogage (²)" aria-label="Infos de débogage">
        <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3zm0 4h2v-2H3zm0-8h2V7H3zm4 4h14v-2H7zm0 4h14v-2H7zM7 7v2h14V7z"/></svg>
      </button>
    </div>
  </div>

  <div class="hint" id="hint">
    <p><strong>Maintiens</strong> pour charger, <strong>relâche</strong> pour sauter.</p>
    <p class="small">Touche à droite ou à gauche du ballon pour choisir la direction.</p>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
